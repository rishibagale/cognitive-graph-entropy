[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-graph-entropy"
version = "0.1.0"
description = "Three-axis information-theoretic and spectral framework for cognitive knowledge graphs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
py-modules = ["cognitive_graph_entropy"]
